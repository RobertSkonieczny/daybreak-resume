name: Deploy resume to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # Dependencies are vendored; this site does not need an install or build.
      - name: Validate resume content and local assets
        run: npm run validate

      - name: Check content, navigation, and wildlife
        run: npm test

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
